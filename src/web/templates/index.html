<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Cheat Detection System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sunuwar&display=swap" rel="stylesheet">
    <style>body{font-family:'Noto Sans Sunuwar',sans-serif;font-weight:400;font-style:normal;}</style>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">Chess Cheat Detection System</span>
            <div class="d-flex">
                <button class="btn btn-outline-light me-2" onclick="newGame()">New Game</button>
                <button class="btn btn-outline-warning" onclick="showImportModal()">Import PGN</button>
            </div>
        </div>
    </nav>
    <div class="container-fluid mt-4">
        <div class="row">
            <div class="col-md-6">
                <div class="card enhanced-card">
                    <div class="card-header enhanced-card-header">
                        <h5 class="mb-0">Chess Board</h5>
                    </div>
                    <div class="card-body">
                        <div id="board" class="enhanced-chessboard" style="width: 100%; max-width: 500px; margin: 0 auto;" data-tooltip="Interactive Chess Board - Drag pieces to make moves"></div>
                        <div class="mt-3 text-center">
                            <button class="btn btn-primary animated-btn" onclick="detectCheat()" data-tooltip="Analyze current position for suspicious moves"><span class="btn-text">Detect Cheat</span></button>
                            <button class="btn btn-secondary animated-btn" onclick="captureFromCamera()" data-tooltip="Capture board position from camera"><span class="btn-text">Capture Board</span></button>
                            <button class="btn btn-info animated-btn" onclick="analyzeFEN()" data-tooltip="Analyze the current FEN position"><span class="btn-text">Analyze FEN</span></button>
                            <button class="btn glow-btn ms-2" id="finishGameBtn" data-tooltip="Save current game to PGN list">Finish Game</button>
                            <button class="btn glow-btn ms-1" id="newGameBtn" data-tooltip="Start a new chess game">New Game</button>
                            <div class="mt-3">
                                <button class="btn btn-dark ms-2" onclick="prevMove()">&#9664;</button>
                                <button class="btn btn-dark ms-1" onclick="nextMove()">&#9654;</button>
                                <button class="btn btn-dark ms-1" onclick="goToStart()">&#124;&lt;</button>
                                <button class="btn btn-dark ms-1" onclick="goToEnd()">&gt;&#124;</button>
                                <button class="btn btn-dark ms-1" onclick="flipBoard()">Flip Board</button>
                            </div>
                        </div>
                        <div class="mt-3">
                            <label for="fenInput" class="form-label">FEN Position:</label>
                            <input type="text" class="form-control" id="fenInput" placeholder="Enter FEN string">
                            <button class="btn btn-info mt-2" onclick="applyFEN()">Apply FEN</button>
                        </div>
                        <div class="mt-3">
                            <label for="pgnInput" class="form-label">PGN:</label>
                            <textarea class="form-control" id="pgnInput" rows="2" placeholder="Enter PGN string"></textarea>
                            <button class="btn btn-info mt-2" onclick="applyPGN()">Apply PGN</button>
                        </div>
                        <div class="mt-3">
                            <label for="analyzePgnInput" class="form-label">Analyze PGN:</label>
                            <textarea class="form-control" id="analyzePgnInput" rows="2" placeholder="Paste PGN here for analysis"></textarea>
                            <button class="btn btn-info mt-2" id="analyzePgnBtn">Analyze PGN</button>
                            <div id="pgn-analysis-result" class="mt-2"></div>
                            <div id="cheat-detect-result" class="mt-2"></div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card enhanced-card mb-3">
                    <div class="card-header enhanced-card-header">
                        <h5 class="mb-0">Current Analysis</h5>
                    </div>
                    <div class="card-body enhanced-card-body">
                        <div id="currentAnalysis">
                            <p class="text-muted">Make a move to see analysis</p>
                        </div>
                    </div>
                </div>
                <div class="card enhanced-card">
                    <div class="card-header enhanced-card-header">
                        <h5 class="mb-0">Move History & Analysis</h5>
                    </div>
                    <div class="card-body enhanced-card-body enhanced-scrollbar" style="max-height: 400px; overflow-y: auto;">
                        <table class="table table-sm enhanced-table">
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>White</th>
                                    <th>Black</th>
                                    <th>White Best</th>
                                    <th>Black Best</th>
                                    <th>White Eval</th>
                                    <th>Black Eval</th>
                                    <th>White Suspicion</th>
                                    <th>Black Suspicion</th>
                                </tr>
                            </thead>
                            <tbody id="moveHistory">
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="card enhanced-card mt-3">
                    <div class="card-header enhanced-card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">Added PGN</h5>
                    </div>
                    <div class="card-body enhanced-card-body enhanced-scrollbar" id="addedPgnBox" style="max-height: 200px; overflow-y: auto;">
                        <!-- PGN list will be rendered here -->
                    </div>
                </div>
            </div>
        </div>
        <div id="alertContainer" class="position-fixed bottom-0 end-0 p-3" style="z-index: 11">
        </div>
    </div>
    <div id="sidebar-overlay">
      <div id="sidebar">
        <div class="sidebar-header">
          <span id="sidebar-title">Analysis</span>
          <button class="close-btn" onclick="closeSidebar()">&times;</button>
        </div>
        <div class="sidebar-content" id="sidebar-content">
      
        </div>
      </div>
    </div>
    <div class="modal fade" id="importModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Import PGN Game</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <textarea class="form-control" id="pgnText" rows="10" placeholder="Paste PGN here..."></textarea>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" onclick="importPGN()">Import & Analyze</button>
                </div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="cameraModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Camera Capture</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body text-center">
                    <img id="capturedImage" class="img-fluid" style="display: none;">
                    <div id="cameraLoading" class="spinner-border" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <div class="mt-3">
                        <label for="boardImageUpload" class="form-label">Or upload a board image:</label>
                        <input type="file" class="form-control" id="boardImageUpload" accept="image/*">
                        <button class="btn btn-info mt-2" id="uploadBoardImageBtn">Upload Image</button>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" onclick="useCapturedPosition()">Use This Position</button>
                </div>
            </div>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chess.js@0.12.0/chess.min.js"></script>
    <script src="https://cdn.socket.io/4.5.0/socket.io.min.js"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
