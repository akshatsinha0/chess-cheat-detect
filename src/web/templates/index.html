<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Cheat Detection System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">Chess Cheat Detection System</span>
            <div class="d-flex">
                <button class="btn btn-outline-light me-2" onclick="newGame()">New Game</button>
                <button class="btn btn-outline-warning" onclick="showImportModal()">Import PGN</button>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-4">
        <div class="row">
            <!-- Chess Board Column -->
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">Chess Board</h5>
                    </div>
                    <div class="card-body">
                        <div id="board" style="width: 100%; max-width: 500px; margin: 0 auto;"></div>
                        <div class="mt-3 text-center">
                            <button class="btn btn-primary" onclick="detectCheat()">Detect Cheat</button>
                            <button class="btn btn-secondary" onclick="captureFromCamera()">Capture Board</button>
                            <button class="btn btn-info" onclick="analyzeFEN()">Analyze FEN</button>
                        </div>
                        <div class="mt-3">
                            <label for="fenInput" class="form-label">FEN Position:</label>
                            <input type="text" class="form-control" id="fenInput" placeholder="Enter FEN string">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Analysis Column -->
            <div class="col-md-6">
                <div class="card mb-3">
                    <div class="card-header">
                        <h5 class="mb-0">Current Analysis</h5>
                    </div>
                    <div class="card-body">
                        <div id="currentAnalysis">
                            <p class="text-muted">Make a move to see analysis</p>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">Move History & Analysis</h5>
                    </div>
                    <div class="card-body" style="max-height: 400px; overflow-y: auto;">
                        <table class="table table-sm">
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>White</th>
                                    <th>Black</th>
                                    <th>White Best</th>
                                    <th>Black Best</th>
                                    <th>White Eval</th>
                                    <th>Black Eval</th>
                                    <th>White Suspicion</th>
                                    <th>Black Suspicion</th>
                                </tr>
                            </thead>
                            <tbody id="moveHistory">
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <!-- Alerts -->
        <div id="alertContainer" class="position-fixed bottom-0 end-0 p-3" style="z-index: 11">
        </div>
    </div>

    <!-- Import PGN Modal -->
    <div class="modal fade" id="importModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Import PGN Game</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <textarea class="form-control" id="pgnText" rows="10" placeholder="Paste PGN here..."></textarea>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" onclick="importPGN()">Import & Analyze</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Camera Capture Modal -->
    <div class="modal fade" id="cameraModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Camera Capture</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body text-center">
                    <img id="capturedImage" class="img-fluid" style="display: none;">
                    <div id="cameraLoading" class="spinner-border" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" onclick="useCapturedPosition()">Use This Position</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chess.js@0.12.0/chess.min.js"></script>
    <script src="https://cdn.socket.io/4.5.0/socket.io.min.js"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
