[pytest]
# pytest.ini - pytest configuration

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test directories
testpaths = tests

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    
# Coverage options when run with --cov
[coverage:run]
source = src
omit = 
    */tests/*
    */__init__.py
    */venv/*
    */.venv/*
